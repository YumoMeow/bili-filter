<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <!-- 手机端响应式布局的关键 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Bili Filter</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div class="app">

        <!-- 顶部导航 -->
        <header class="header">
            <div class="header__inner">
                <a href="index.html" class="logo">
                    Bili Filter
                </a>

                <a href="settings.html" class="header__button">
                    设置
                </a>
            </div>
        </header>


        <!-- 页面主体 -->
        <main class="main">

            <!-- 页面标题 -->
            <section class="page-heading">
                <div>
                    <h1>今日队列</h1>
                    <p class="page-heading__description">
                        只有符合规则的视频才会出现在这里。
                    </p>
                </div>
            </section>


            <!-- 预算区域：Phase 0 只占位 -->
            <section class="budget-card">
                <div class="budget-card__label">
                    今日观看预算
                </div>

                <div class="budget-card__time">
                    --:--
                </div>

                <div class="budget-card__description">
                    Phase 4 开始启用观看预算
                </div>
            </section>


            <!-- 视频队列 -->
            <section class="queue-section">

                <div class="section-heading">
                    <h2>可观看视频</h2>

                    <button
                        id="refresh-button"
                        class="button button--small"
                        type="button"
                    >
                        刷新
                    </button>
                </div>

                <div
                    id="video-list"
                    class="video-list"
                ></div>

            </section>


            <!-- Cookie 设置 -->
            <section class="cookie-section">

                <details class="cookie-card">

                    <summary>
                        B 站 Cookie 设置
                    </summary>

                    <p class="cookie-card__hint">
                        如果视频抓取失败（风控拦截），
                        请在浏览器登录 B 站后，
                        复制 Cookie 中的 SESSDATA 粘贴到这里。
                    </p>

                    <form
                        id="cookie-form"
                        class="cookie-form"
                    >

                        <input
                            id="cookie-input"
                            class="cookie-form__input"
                            type="text"
                            autocomplete="off"
                            placeholder="粘贴 SESSDATA"
                        >

                        <button
                            class="button button--primary"
                            type="submit"
                        >
                            保存 Cookie
                        </button>

                    </form>

                    <p
                        id="cookie-status"
                        class="cookie-card__status"
                    >
                        正在读取 Cookie 状态……
                    </p>

                </details>

            </section>

        </main>


        <!-- Toast -->
        <div
            id="toast"
            class="toast"
            role="status"
            aria-live="polite"
        ></div>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
