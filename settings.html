<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>白名单 - Bili Filter</title>

    <link
        rel="stylesheet"
        href="css/common.css"
    >

    <link
        rel="stylesheet"
        href="css/settings.css"
    >

</head>


<body>

<div class="app">


    <!-- ==========================================
         Header
         ========================================== -->

    <header class="header">

        <div class="header__inner">

            <a
                href="index.html"
                class="back-button"
            >
                <span aria-hidden="true">←</span>
                <span>返回</span>
            </a>


            <div class="header__title">
                白名单
            </div>


            <div class="header__placeholder"></div>

        </div>

    </header>


    <!-- ==========================================
         Main
         ========================================== -->

    <main class="main">


        <!-- 页面标题 -->

        <section class="page-heading">

            <h1>
                永久白名单
            </h1>

            <p class="page-heading__description">
                白名单中的 UP 主发布的视频可以进入你的观看队列。
            </p>

        </section>


        <!-- ======================================
             修改状态
             ====================================== -->

        <section
            id="modification-card"
            class="modification-card"
        >

            <h2
                id="modification-title"
                class="modification-card__title"
            >
                正在检查白名单状态……
            </h2>


            <p
                id="modification-description"
                class="modification-card__description"
            >
                请稍候。
            </p>


            <div
                id="modification-time"
                class="modification-card__time"
            ></div>

        </section>


        <!-- ======================================
             白名单
             ====================================== -->

        <section class="settings-section">


            <div class="section-heading">

                <h2>
                    UP 主
                </h2>


                <span
                    id="whitelist-count"
                    class="section-heading__count"
                >
                    0
                </span>

            </div>


            <div
                id="whitelist-list"
                class="whitelist-list"
            >
            </div>


            <div
                id="edit-actions"
                class="edit-actions"
            >

                <button
                    id="edit-whitelist-button"
                    class="button button--primary button--full"
                    type="button"
                >
                    编辑白名单
                </button>


                <div
                    id="draft-actions"
                    class="draft-actions"
                    hidden
                >

                    <button
                        id="add-whitelist-button"
                        class="button button--primary"
                        type="button"
                    >
                        ＋ 添加 UP 主
                    </button>


                    <button
                        id="cancel-edit-button"
                        class="button"
                        type="button"
                    >
                        取消
                    </button>


                    <button
                        id="save-edit-button"
                        class="button button--primary"
                        type="button"
                    >
                        保存修改
                    </button>

                </div>

            </div>


        </section>


        <!-- ======================================
             规则说明
             ====================================== -->

        <section class="settings-section">

            <div class="section-heading">

                <h2>
                    修改规则
                </h2>

            </div>


            <div class="info-card">


                <div class="info-row">

                    <span>
                        白名单修改周期
                    </span>

                    <strong>
                        7 天
                    </strong>

                </div>


                <div class="info-row">

                    <span>
                        新增 UP 主冷静期
                    </span>

                    <strong>
                        24 小时
                    </strong>

                </div>


                <div class="info-row">

                    <span>
                        每日观看预算
                    </span>

                    <strong>
                        90 分钟
                    </strong>

                </div>


            </div>

        </section>


        <!-- ======================================
             重置
             ====================================== -->

        <section class="settings-section">

            <div class="section-heading">

                <h2>
                    重置
                </h2>

            </div>


            <div class="info-card">

                <div class="info-row">

                    <span>
                        恢复成首次打开时的状态
                    </span>

                    <button
                        id="reset-default-button"
                        class="button button--danger"
                        type="button"
                    >
                        重置为默认
                    </button>

                </div>

            </div>

        </section>


    </main>


    <!-- ==========================================
         Add User Modal
         ========================================== -->

    <div
        id="add-modal"
        class="modal-backdrop"
        aria-hidden="true"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="add-modal-title"
        >

            <div class="modal__header">

                <h2
                    id="add-modal-title"
                    class="modal__title"
                >
                    添加 UP 主
                </h2>


                <button
                    id="modal-close"
                    class="modal__close"
                    type="button"
                    aria-label="关闭"
                >
                    ×
                </button>

            </div>


            <form
                id="add-form"
                class="add-form"
            >


            <div class="form-field">

                <label
                    for="whitelist-mid"
                >
                    B站 UID
                </label>

                <input
                    id="whitelist-mid"
                    type="text"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="请输入 UP 主 UID"
                >

                <p class="form-field__hint">
                    只需要输入 UID，系统会自动获取 UP 主信息。
                </p>

            </div>

            <div
                id="user-preview"
                class="user-preview"
                hidden
            >
            </div>


                <div class="modal__actions">

                    <button
                        id="modal-cancel"
                        class="button"
                        type="button"
                    >
                        取消
                    </button>


                    <button
                        class="button button--primary"
                        type="submit"
                    >
                        添加
                    </button>

                </div>


            </form>

        </div>

    </div>


    <!-- Toast -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


</div>


<script
    type="module"
    src="js/settings.js"
></script>


</body>

</html>
